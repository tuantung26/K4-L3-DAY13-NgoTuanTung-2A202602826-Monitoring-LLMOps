alerts:
  - name: high_latency_p95
    severity: warning
    condition: p95(latency_ms) > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-oncall"
    owner: oncall-engineer
    runbook: docs/alerts.md#high-latency-p95

  - name: elevated_error_rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 3m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-oncall"
    owner: oncall-engineer
    runbook: docs/alerts.md#elevated-error-rate

  - name: low_retrieval_success
    severity: warning
    condition: tool_success_rate_pct < 90
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-oncall"
    owner: oncall-engineer
    runbook: docs/alerts.md#low-retrieval-success
